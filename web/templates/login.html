<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iconix Cron - Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>

<body class="h-full font-sans antialiased flex items-center justify-center p-4">

    <div class="glass-panel max-w-md w-full rounded-2xl p-8 shadow-2xl relative border border-slate-800">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div
                class="inline-flex p-3 bg-indigo-600 rounded-xl text-white font-bold shadow-lg shadow-indigo-500/30 mb-3">
                <i class="fa-solid fa-clock-rotate-left text-2xl"></i>
            </div>
            <h2 class="text-xl font-bold text-white tracking-tight">Iconix Cron</h2>
            <p class="text-xs text-slate-400 mt-1">Internal Scheduler Administration</p>
        </div>

        <!-- Error Alert -->
        {{if .Error}}
        <div
            class="mb-6 p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-sm"></i>
            <span>{{.Error}}</span>
        </div>
        {{end}}

        <!-- Form -->
        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" name="username" required placeholder="username" autocomplete="username"
                        class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="password" name="password" required placeholder="password"
                        autocomplete="current-password"
                        class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full py-2.5 px-4 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 rounded-lg shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket text-xs"></i> Sign In
                </button>
            </div>
        </form>

        <div class="mt-8 text-center border-t border-slate-800/80 pt-4">
            <p class="text-[11px] text-slate-500">Iconix Cron Scheduler &bull; 1-Hour Session Security</p>
        </div>
    </div>

</body>

</html>
