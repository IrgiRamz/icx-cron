  <line x1="100" y1="64" x2="94" y2="64" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="100" x2="64" y2="94" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="64" x2="34" y2="64" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

  <!-- Lightning Bolt / Fast Execution Symbol -->
